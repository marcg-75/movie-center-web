name: CI
on:
  push:
    branches:
      # GitHub event filters do not support workflow variables.
      - master
  pull_request:
    branches: [master]

env:
  MAIN_BRANCH: master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ env.MAIN_BRANCH }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        id: pnpm-install
        with:
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm exec nx format:check --base=origin/${{ env.MAIN_BRANCH }}

      - name: Nx linting check
        run: pnpm exec nx affected --base=origin/${{ env.MAIN_BRANCH }} --head=HEAD --target=lint --parallel=3

      - name: Run lint
        run: pnpm lint

      - name: Nx unit test
        run: pnpm exec nx affected --base=origin/${{ env.MAIN_BRANCH }} --head=HEAD -t test --parallel=3

      - name: Run tests
        run: pnpm test

      - name: Nx build check
        run: pnpm exec nx affected --base=origin/${{ env.MAIN_BRANCH }} --head=HEAD -t build --parallel=3
